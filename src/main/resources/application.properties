spring.application.name=notification-service
spring.mail.properties.mail.smtp.localhost=fitmais-notification-service
server.port=8081

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.mail.host=smtp.gmail.com
spring.mail.port=587

fitmais.frontend.url=http://localhost:3000

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logs para diagnostico - deixar ativo enquanto estiver testando o envio de e-mail
logging.level.br.com.fitmais_notification=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=DEBUG
spring.mail.properties.mail.debug=true